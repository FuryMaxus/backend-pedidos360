service: backend-pedidos360
useDotenv: true
provider:
  name: aws
  runtime: python3.13
  region: us-east-1
  role: arn:aws:iam::362471493855:role/LabRole 
  environment:
    TABLA_PEDIDOS: pedidos-tabla-dev
    TABLA_CATALOGO: catalogo-tabla-dev
    ESTADOS_PERMITIDOS: "CREADO,ACEPTADO,EN_PREPARACION,DESPACHADO,ENTREGADO,CANCELADO"
    TOPIC_ARN_EVENTOS: !Ref PedidosTopic
    DLQ_EMAIL_URL: !Ref EmailDLQ
    DLQ_KITCHEN_URL: !Ref KitchenDLQ
    DLQ_INVOICE_URL: !Ref InvoiceDLQ
    DLQ_STOCK_URL: !Ref StockDLQ
  httpApi:
    cors: true
    authorizers:
      entraIdAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://login.microsoftonline.com/${env:ENTRA_TENANT_ID}/v2.0
        audience:
          - ${env:ENTRA_CLIENT_ID}


functions:
  crearPedido:
    handler: src.pedidos.crear_pedido
    events:
      - httpApi:
          path: /api/orders
          method: post
          authorizer: 
            name: entraIdAuthorizer
            scopes:
              - orders.write
  listarPedidos:
    handler: src.pedidos.listar_pedidos
    events:
      - httpApi:
          path: /api/orders
          method: get
          authorizer: 
            name: entraIdAuthorizer
            scopes:
              - orders.read
  obtenerPedido:
    handler: src.pedidos.obtener_pedido
    events:
      - httpApi:
          path: /api/orders/{id}
          method: get
          authorizer: 
            name: entraIdAuthorizer
            scopes:
              - orders.read
  actualizarEstadoPedido:
    handler: src.pedidos.actualizar_estado
    events:
      - httpApi:
          path: /api/orders/{id}/estado
          method: patch
          authorizer: 
            name: entraIdAuthorizer
            scopes:
              - orders.write

  crearProducto:
    handler: src.catalogo.crear_producto
    events:
      - httpApi:
          path: /api/catalog
          method: post
          authorizer: 
            name: entraIdAuthorizer
            scopes:
              - catalog.write
  listarProductos:
    handler: src.catalogo.listar_productos
    events:
      - httpApi:
          path: /api/catalog
          method: get
  actualizarStockProducto:
    handler: src.catalogo.actualizar_stock
    events:
      - httpApi:
          path: /api/catalog/{id}/stock
          method: patch
          authorizer: 
            name: entraIdAuthorizer
            scopes:
              - catalog.write
  actualizarProducto:
    handler: src.catalogo.actualizar_producto
    events:
      - httpApi:
          path: /api/catalog/{id}
          method: patch
          authorizer: 
            name: entraIdAuthorizer
            scopes:
              - catalog.write
  eliminarProducto:
    handler: src.catalogo.eliminar_producto
    events:
      - httpApi:
          path: /api/catalog/{id}
          method: delete
          authorizer: 
            name: entraIdAuthorizer
            scopes:
              - catalog.write 
  
  crearCola:
    handler: src/admin_colas.crear_cola
    events:
      - httpApi:
          path: /api/queues
          method: post
          authorizer:
            name: entraIdAuthorizer
            scopes:
              - catalog.write
  eliminarCola:
    handler: src/admin_colas.eliminar_cola
    events:
      - httpApi:
          path: /api/queues
          method: delete
          authorizer:
            name: entraIdAuthorizer
            scopes:
              - catalog.write
              
  notificar-email:
    handler: src.notificaciones.enviar_email
    events:
      - sqs:
          arn: !GetAtt EmailQueue.Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures
  ticket-cocina:
    handler: src.notificaciones.imprimir_ticket
    events:
      - sqs:
          arn: !GetAtt KitchenQueue.Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures
  generar-boleta:
    handler: src.notificaciones.generar_boleta
    events:
      - sqs:
          arn: !GetAtt InvoiceQueue.Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures
  descontarStockEvento:
    handler: src.catalogo.descontar_stock_evento
    events:
      - sqs:
          arn: !GetAtt StockQueue.Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures
  

resources:
  Resources:
    TablaPedidosDynamo:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: pedidos-tabla-dev
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST 

    TablaCatalogoDynamo:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: catalogo-tabla-dev
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    PedidosTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: pedidos360-eventos
    
    EmailDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: q-email-dlq
    KitchenDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: q-kitchen-dlq
    InvoiceDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: q-invoice-dlq
    StockDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: q-stock-dlq
    
    EmailQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: q-email
        VisibilityTimeout: 30
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt EmailDLQ.Arn
          maxReceiveCount: 3
    KitchenQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: q-kitchen
        VisibilityTimeout: 30
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt KitchenDLQ.Arn
          maxReceiveCount: 3
    InvoiceQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: q-invoice
        VisibilityTimeout: 30
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt InvoiceDLQ.Arn
          maxReceiveCount: 3
    StockQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: q-stock
        VisibilityTimeout: 30
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt StockDLQ.Arn
          maxReceiveCount: 3
    
    EmailSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        Endpoint: !GetAtt EmailQueue.Arn
        TopicArn: !Ref PedidosTopic
        RawMessageDelivery: true
    KitchenSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        Endpoint: !GetAtt KitchenQueue.Arn
        TopicArn: !Ref PedidosTopic
        RawMessageDelivery: true
        FilterPolicy:
          tipo_evento: ["PedidoAceptado"]
    InvoiceSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        Endpoint: !GetAtt InvoiceQueue.Arn
        TopicArn: !Ref PedidosTopic
        RawMessageDelivery: true
        FilterPolicy:
          tipo_evento: ["PedidoDespachado"]
    StockSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        Endpoint: !GetAtt StockQueue.Arn
        TopicArn: !Ref PedidosTopic
        RawMessageDelivery: true
        FilterPolicy:
          tipo_evento: ["PedidoAceptado"]
    
    SqsSnsPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref EmailQueue
          - !Ref KitchenQueue
          - !Ref InvoiceQueue
          - !Ref StockQueue
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: sns.amazonaws.com
              Action: sqs:SendMessage
              Resource: "*"
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref PedidosTopic
